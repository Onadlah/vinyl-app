        body { font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Glassmorphism Classes */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
        
        /* Animations */
        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .toast-enter { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .modal-enter { animation: fadeIn 0.3s ease-out forwards; }
        .modal-content-enter { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Custom Scrollbar for chips */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 3px solid #6366f1; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }

        // --- UI Helpers (Toasts & Modals) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-emerald-500 border-emerald-400',
                error: 'bg-rose-500 border-rose-400',
                warning: 'bg-amber-500 border-amber-400',
                info: 'bg-indigo-500 border-indigo-400'
            };
            
            toast.className = `toast-enter flex items-center p-4 rounded-2xl shadow-xl border text-white ${colors[type]}`;
            toast.innerHTML = `<span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- Android Back Button Fix (History API) ---
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
            history.pushState({ modal: id }, "", `#${id}`);
        }

        function closeModal(id, goBack = true) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
            if (goBack && window.location.hash === `#${id}`) {
                history.back();
            }
        }

        window.addEventListener('popstate', (event) => {
            document.querySelectorAll('[id$="-modal"]').forEach(modal => {
                if (!modal.classList.contains('hidden')) {
                    closeModal(modal.id, false); 
                }
            });
        });

        // --- Core Navigation ---
        function switchTab(tabId) {
            activeTab = tabId;
            document.getElementById('tab-scanner').classList.toggle('hidden', tabId !== 'scanner');
            document.getElementById('tab-collection').classList.toggle('hidden', tabId !== 'collection');
            
            document.getElementById('nav-scanner').classList.toggle('text-indigo-400', tabId === 'scanner');
            document.getElementById('nav-scanner').classList.toggle('text-slate-500', tabId !== 'scanner');
            
            document.getElementById('nav-collection').classList.toggle('text-indigo-400', tabId === 'collection');
            document.getElementById('nav-collection').classList.toggle('text-slate-500', tabId !== 'collection');

            if (tabId !== 'scanner' && html5QrCode) {
                stopScanner();
            }

            if (tabId === 'collection') {
                // Initial load if array is empty, otherwise just render
                if (collectionData.length === 0) fetchCollection();
                else renderCollection();
            }
        }

        // --- Form Reset Logic (Fixing Sticky Notes) ---
        function resetFormFields() {
            document.getElementById('form-artist').value = '';
            document.getElementById('form-album').value = '';
            document.getElementById('form-year').value = '';
            document.getElementById('form-notes').value = '';
            document.getElementById('form-vinyl-cond').value = 'M';
            document.getElementById('form-sleeve-cond').value = 'M';
            document.getElementById('form-status').value = 'Collection';
        }

        function clearSearchUI() {
            document.getElementById('manual-search-input').value = '';
            document.getElementById('search-results').innerHTML = '';
        }

        // --- STREAMING_CHUNK:Implementing Discogs Search... ---
        async function fetchFromDiscogs(query, isBarcode = true) {
            if (YOUR_DISCOGS_TOKEN.includes("YOUR_")) {
                showToast("Please add your Discogs API Token in the code.", "error");
                return null;
            }

            const searchType = isBarcode ? `barcode=${query}` : `q=${encodeURIComponent(query)}`;
            const url = `https://api.discogs.com/database/search?${searchType}&token=${YOUR_DISCOGS_TOKEN}`;
            
            try {
                showToast("Searching Discogs...", "info");
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    return data.results;
                } else {
                    showToast("No records found.", "warning");
                    return null;
                }
            } catch (error) {
                showToast("Failed to reach Discogs API.", "error");
                return null;
            }
        }

        async function searchDiscogsText() {
            const query = document.getElementById('manual-search-input').value;
            if (!query) return;
            
            const results = await fetchFromDiscogs(query, false);
            if (results) displaySearchResults(results);
        }

        function displaySearchResults(results) {
            const container = document.getElementById('search-results');
            container.innerHTML = '<h3 class="font-semibold text-sm text-slate-400 px-2 mt-4">Top Results</h3>';
            
            results.slice(0, 3).forEach(release => {
                let parts = release.title.split(' - ');
                let artist = parts[0] || "Unknown";
                let album = parts[1] || release.title;

                const card = document.createElement('div');
                card.className = "glass p-3 rounded-2xl flex items-center gap-4 active:scale-95 transition-transform cursor-pointer border border-slate-700/50";
                card.onclick = () => prepFormFromAPI(release, artist, album);
                
                let thumb = release.thumb || 'https://placehold.co/150x150/1e293b/ffffff?text=No+Cover';
                let format = release.formats ? release.formats[0] : 'Vinyl';

                card.innerHTML = `
                    <img src="${thumb}" class="w-16 h-16 rounded-lg object-cover shadow">
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm truncate text-white">${album}</p>
                        <p class="text-xs text-indigo-400 truncate">${artist}</p>
                        <p class="text-[10px] text-slate-400 mt-1">${release.year || 'Unknown Year'} • ${format}</p>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-indigo-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- STREAMING_CHUNK:Implementing Camera Scanner... ---
        function startScanner() {
            const readerContainer = document.getElementById('reader-container');
            const scannerButtons = document.getElementById('scanner-buttons');
            
            readerContainer.classList.remove('hidden');
            readerContainer.classList.add('flex');
            scannerButtons.classList.add('hidden');
            clearSearchUI();
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            const config = { fps: 10, qrbox: { width: 250, height: 100 }, aspectRatio: 1.0 };
            
            html5QrCode.start({ facingMode: "environment" }, config, async (decodedText) => {
                stopScanner();
                showToast(`Barcode Scanned: ${decodedText}`, 'success');
                
                const results = await fetchFromDiscogs(decodedText, true);
                if (results) {
                    // Check for duplicate immediately on scan
                    const duplicate = collectionData.find(item => item[1] == results[0].id);
                    if (duplicate) {
                        showToast(`Warning: This is already in your ${duplicate[11] || 'Library'}!`, 'warning');
                    }
                    displaySearchResults(results);
                } else {
                    openManualOverride();
                    showToast(`Barcode not found. Please enter manually.`, 'warning');
                }
            }, (error) => {}).catch(err => {
                showToast("Camera access denied or unavailable.", "error");
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').classList.add('hidden');
                    document.getElementById('reader-container').classList.remove('flex');
                    document.getElementById('scanner-buttons').classList.remove('hidden');
                }).catch(err => console.log(err));
            }
        }

        // --- STREAMING_CHUNK:Implementing Database Submission Logic... ---
        function openManualOverride() {
            currentRelease = {}; 
            resetFormFields();
            document.getElementById('form-thumb').src = 'https://placehold.co/400x400/1e293b/ffffff?text=Custom';
            openModal('form-modal');
        }

        function prepFormFromAPI(release, artist, album) {
            currentRelease = release;
            resetFormFields();
            
            document.getElementById('form-artist').value = artist;
            document.getElementById('form-album').value = album;
            document.getElementById('form-year').value = release.year || '';
            document.getElementById('form-thumb').src = release.thumb || 'https://placehold.co/400x400/1e293b/ffffff?text=No+Cover';
            
            openModal('form-modal');
        }

        async function submitToGoogleSheet() {
            if (YOUR_GOOGLE_WEB_APP_URL.includes("YOUR_")) {
                showToast("Please add your Google Web App URL.", "error");
                return;
            }

            const artistInput = document.getElementById('form-artist').value.trim();
            const albumInput = document.getElementById('form-album').value.trim();

            if (!artistInput || !albumInput) {
                showToast("Artist and Album are required.", "warning");
                return;
            }

            // IRONCLAD DUPLICATE CHECK
            const isDuplicate = collectionData.some(row => {
                const rowId = row[1];
                const rowArtist = (row[2] || '').toLowerCase();
                const rowAlbum = (row[3] || '').toLowerCase();
                
                // Match by Discogs ID (if we have one)
                if (currentRelease.id && rowId == currentRelease.id) return true;
                // Match by exact text string
                if (rowArtist === artistInput.toLowerCase() && rowAlbum === albumInput.toLowerCase()) return true;
                
                return false;
            });

            if (isDuplicate) {
                showToast("Error: This album is already in your library!", "error");
                return; // Stop the save
            }

            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<div class="loader !w-5 !h-5 !border-t-white"></div>';
            btn.disabled = true;

            let extractedGenre = "Unknown";
            if (currentRelease.genre && currentRelease.genre.length > 0) extractedGenre = currentRelease.genre[0];

            let dUrl = "";
            if (currentRelease.uri) dUrl = `https://www.discogs.com${currentRelease.uri}`;

            const payload = {
                releaseId: currentRelease.id || `MANUAL-${Date.now()}`,
                artist: artistInput,
                album: albumInput,
                year: document.getElementById('form-year').value,
                vinylCondition: document.getElementById('form-vinyl-cond').value,
                sleeveCondition: document.getElementById('form-sleeve-cond').value,
                notes: document.getElementById('form-notes').value,
                imageUrl: document.getElementById('form-thumb').src,
                genre: extractedGenre,
                discogsUrl: dUrl,
                status: document.getElementById('form-status').value
            };

            try {
                // The False-Error Fix: using await with no-cors.
                await fetch(YOUR_GOOGLE_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // If the fetch doesn't hard-fail (network down), we assume success!
                showToast(`Successfully added to ${payload.status}!`, 'success');
                closeModal('form-modal');
                
                // Reset scanner workflow
                clearSearchUI();
                
                // Secretly fetch collection in background to sync database
                fetchCollection(true);
                
            } catch (error) {
                showToast("Network Error: Could not save to database.", "error");
            } finally {
                btn.innerHTML = '<span>Save Record</span>';
                btn.disabled = false;
            }
        }

        // --- STREAMING_CHUNK:Implementing Data Sanitization & Live Search... ---
        let currentFilter = 'All';

        async function fetchCollection(isBackground = false) {
            if (YOUR_GOOGLE_WEB_APP_URL.includes("YOUR_")) {
                if (!isBackground) loadMockData();
                return;
            }

            if (!isBackground) {
                document.getElementById('collection-grid').innerHTML = '';
                document.getElementById('collection-loading').classList.remove('hidden');
                document.getElementById('collection-empty').classList.add('hidden');
            }
            
            document.getElementById('sync-status').textContent = 'Syncing...';
            document.getElementById('sync-status').classList.add('animate-pulse');

            try {
                const response = await fetch(YOUR_GOOGLE_WEB_APP_URL);
                const data = await response.json();
                
                data.shift(); // Remove header row
                
                // DATA SANITIZER: Filter out empty/broken rows before doing anything
                const cleanData = data.filter(row => {
                    const hasArtist = row[2] && String(row[2]).trim() !== '';
                    const hasAlbum = row[3] && String(row[3]).trim() !== '';
                    return hasArtist && hasAlbum;
                });
                
                // Sort A-Z strictly by Artist
                collectionData = cleanData.sort((a, b) => {
                    let artistA = String(a[2]).toLowerCase();
                    let artistB = String(b[2]).toLowerCase();
                    return artistA.localeCompare(artistB);
                });
                
                document.getElementById('sync-status').textContent = 'Synced';
                document.getElementById('sync-status').classList.remove('animate-pulse');
                
                if (activeTab === 'collection' || isBackground) {
                    renderFilters();
                    renderCollection();
                }
            } catch (error) {
                showToast("Failed to load collection.", "error");
                document.getElementById('sync-status').textContent = 'Error';
                document.getElementById('sync-status').classList.remove('animate-pulse');
            } finally {
                if (!isBackground) {
                    document.getElementById('collection-loading').classList.add('hidden');
                }
            }
        }

        function renderFilters() {
            const genres = new Set();
            collectionData.forEach(row => {
                if (row[9] && row[9] !== "Unknown") genres.add(row[9]);
            });

            const container = document.getElementById('filter-container');
            const baseButtons = container.innerHTML.split('<!-- Genre chips will be injected here -->')[0];
            
            let genreChips = '<!-- Genre chips will be injected here -->';
            
            Array.from(genres).sort().forEach(genre => {
                const safeGenre = genre.replace(/'/g, "\\'");
                genreChips += `<button onclick="applyFilter('${safeGenre}')" class="filter-btn whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 transition-colors border border-slate-700">${genre}</button>`;
            });

            container.innerHTML = baseButtons + genreChips;
            updateFilterUI();
        }

        function applyFilter(filterType) {
            currentFilter = filterType;
            updateFilterUI();
            renderCollection();
        }

        function updateFilterUI() {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach(btn => {
                if (btn.innerText === currentFilter || 
                   (currentFilter === 'Collection' && btn.innerText === 'Owned') || 
                   (currentFilter === 'All' && btn.innerText === 'All')) {
                    btn.className = "filter-btn active whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white transition-colors";
                } else {
                    btn.className = "filter-btn whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium bg-slate-800 text-slate-300 transition-colors border border-slate-700";
                }
            });
        }

        function renderCollection() {
            const grid = document.getElementById('collection-grid');
            const searchTerm = document.getElementById('library-search').value.toLowerCase();
            grid.innerHTML = '';
            
            // 1. Filter by Chip
            let displayData = collectionData;
            if (currentFilter === 'Collection' || currentFilter === 'Wishlist') {
                displayData = displayData.filter(row => row[11] === currentFilter); 
            } else if (currentFilter !== 'All') {
                displayData = displayData.filter(row => row[9] === currentFilter); 
            }

            // 2. Filter by Live Search Bar
            if (searchTerm) {
                displayData = displayData.filter(row => {
                    const artist = String(row[2]).toLowerCase();
                    const album = String(row[3]).toLowerCase();
                    return artist.includes(searchTerm) || album.includes(searchTerm);
                });
            }

            if (displayData.length === 0) {
                document.getElementById('collection-empty').classList.remove('hidden');
                return;
            }
            
            document.getElementById('collection-empty').classList.add('hidden');

            displayData.forEach((row) => {
                const item = {
                    artist: row[2] || 'Unknown',
                    album: row[3] || 'Unknown Title',
                    year: row[4] || '',
                    vinylCond: row[5] || 'N/A',
                    sleeveCond: row[6] || 'N/A',
                    notes: row[7] || 'No notes.',
                    img: row[8] || 'https://placehold.co/400x400/1e293b/ffffff?text=Vinyl',
                    genre: row[9] || 'Unknown',
                    dUrl: row[10] || '',
                    status: row[11] || 'Collection'
                };

                const card = document.createElement('div');
                card.className = "glass rounded-2xl overflow-hidden shadow-lg active:scale-95 transition-transform cursor-pointer relative border border-slate-700/50";
                const safeItem = encodeURIComponent(JSON.stringify(item));
                card.onclick = () => openDetailView(safeItem);
                
                const badgeColor = item.status === 'Wishlist' ? 'bg-amber-500/90' : 'bg-indigo-600/90';

                card.innerHTML = `
                    <div class="relative pt-[100%]">
                        <img src="${item.img}" loading="lazy" class="absolute inset-0 w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 to-transparent"></div>
                        <span class="absolute top-2 right-2 ${badgeColor} text-white text-[9px] font-bold px-2 py-1 rounded shadow-md uppercase tracking-wider backdrop-blur-md">${item.status}</span>
                    </div>
                    <div class="p-3">
                        <p class="font-bold text-sm truncate leading-tight">${item.album}</p>
                        <p class="text-xs text-indigo-400 truncate mt-0.5">${item.artist}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDetailView(encodedItem) {
            const item = JSON.parse(decodeURIComponent(encodedItem));
            
            document.getElementById('detail-img').src = item.img;
            document.getElementById('detail-title').textContent = item.album;
            document.getElementById('detail-artist').textContent = item.artist;
            document.getElementById('detail-vinyl-cond').textContent = item.vinylCond;
            document.getElementById('detail-sleeve-cond').textContent = item.sleeveCond;
            
            const notesEl = document.getElementById('detail-notes');
            if(!item.notes || item.notes.trim() === '') {
                 notesEl.innerHTML = `<span class="italic text-slate-500">No personal notes added.</span>`;
            } else {
                 notesEl.textContent = item.notes;
            }
            
            const statusBadge = document.getElementById('detail-status');
            statusBadge.textContent = item.status;
            statusBadge.className = item.status === 'Wishlist' 
                ? 'inline-block px-2 py-1 bg-amber-500 rounded text-[10px] text-white font-bold uppercase tracking-wider mb-2 shadow' 
                : 'inline-block px-2 py-1 bg-indigo-600 rounded text-[10px] text-white font-bold uppercase tracking-wider mb-2 shadow';

            let tagsHtml = '';
            if(item.year) tagsHtml += `<span class="px-2 py-1 bg-slate-800 rounded-md border border-slate-700 text-slate-300 shadow-sm">${item.year}</span>`;
            if(item.genre && item.genre !== 'Unknown') tagsHtml += `<span class="px-2 py-1 bg-slate-800 rounded-md border border-slate-700 text-slate-300 shadow-sm">${item.genre}</span>`;
            document.getElementById('detail-tags').innerHTML = tagsHtml;

            const linkContainer = document.getElementById('detail-discogs-container');
            if (item.dUrl && item.dUrl.startsWith('http')) {
                linkContainer.innerHTML = `
                    <a href="${item.dUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-3 bg-[#333333] hover:bg-[#111111] transition-colors rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-lg border border-[#444444]">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.523 4.477 10 10 10 5.523 0 10-4.477 10-10C22 6.477 17.523 2 12 2zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm0-6c-1.103 0-2 .897-2 2s.897 2 2 2 2-.897 2-2-.897-2-2-2z"/></svg>
                        View on Discogs
                    </a>
                `;
            } else {
                linkContainer.innerHTML = '';
            }

            openModal('detail-modal');
        }

        function loadMockData() {
            let rawData = [
                ['', '123', 'Pink Floyd', 'The Dark Side of the Moon', '1973', 'VG+', 'VG', 'Original US press.', 'https://upload.wikimedia.org/wikipedia/en/3/3b/Dark_Side_of_the_Moon.png', 'Rock', 'https://www.discogs.com/master/10362', 'Collection'],
                ['', '124', 'Fleetwood Mac', 'Rumours', '1977', 'M', 'NM', 'Repress, 180g.', 'https://upload.wikimedia.org/wikipedia/en/f/fb/FMacRumours.PNG', 'Rock', 'https://www.discogs.com/master/38722', 'Collection']
            ];
            
            collectionData = rawData.sort((a, b) => {
                let artistA = (a[2] || '').toLowerCase();
                let artistB = (b[2] || '').toLowerCase();
                return artistA.localeCompare(artistB);
            });
            
            document.getElementById('sync-status').textContent = 'Preview';
            document.getElementById('collection-loading').classList.add('hidden');
            renderFilters();
            renderCollection();
        }
    </script>
</body>
</html>
